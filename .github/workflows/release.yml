# Push main to the `release` branch (git push origin main:release) and GitHub builds the installers, tags
# v<package.json version>, and publishes the release. The in-app updater reads latest.json from the latest release
# when a band has no installers/ folder of its own.
name: release
on:
  push:
    branches: ['release']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: electronuserland/builder:wine     # node + wine, so the Windows NSIS installer builds on Linux
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: v
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: rcodesign (ad-hoc mac signing)
        run: |
          curl -sSL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          install -m 755 apple-codesign-0.29.0-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/rcodesign
      - run: apt-get update -qq && apt-get install -y -qq zip >/dev/null
      - run: npm ci
      - run: npm test
      - run: RCODESIGN=/usr/local/bin/rcodesign bash scripts/build.sh all
        env: { HOME: /tmp/home, WINEPREFIX: /tmp/home/.wine, ELECTRON_BUILDER_CACHE: /tmp/home/.cache/electron-builder }   # wine refuses the runner's HOME (not owned by the container user)
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          retention-days: 3
          path: |
            release/Cobander-*-win-x64.exe
            release/Cobander-*-mac-arm64.zip
            release/Cobander-*-mac-x64.zip

  # Windows signing (Azure Artifact Signing) has to run on a Windows runner. Repo variable SIGN_WINDOWS=1 turns it on;
  # without it this job skips signing and publishes the unsigned build exactly as before. latest.json is rebuilt AFTER signing, because
  # signing changes the exe's bytes and the updater checks sha256.
  publish:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write      # OIDC to Entra app cobander-github-signing (federated: repo:jeffman44/cobander:ref:refs/heads/release) — no stored secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { name: installers, path: release }
      - name: version
        id: v
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: azure login (OIDC)
        if: vars.SIGN_WINDOWS == '1'
        uses: azure/login@v2
        with:
          client-id: 7621f106-af90-4233-9fd0-dd1eb6299463
          tenant-id: 7fc4097c-17b2-4913-b8d2-72308ce39403
          allow-no-subscriptions: true
      - name: sign Windows installer
        if: vars.SIGN_WINDOWS == '1'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: cobander
          certificate-profile-name: cobander
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: check signature
        if: vars.SIGN_WINDOWS == '1'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature (Get-ChildItem release\Cobander-*-win-x64.exe)
          "$($s.Status) — $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { exit 1 }
      - name: latest.json
        shell: bash
        run: node scripts/manifest.js "${{ steps.v.outputs.v }}"
      - name: release notes
        shell: bash
        run: node -e "const m=require('./release/latest.json');require('fs').writeFileSync('release/notes.md',m.notes.map(n=>'- '+n).join('\n')+'\n')"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Cobander ${{ steps.v.outputs.v }}
          body_path: release/notes.md
          files: |
            release/Cobander-*-win-x64.exe
            release/Cobander-*-mac-arm64.zip
            release/Cobander-*-mac-x64.zip
            release/latest.json
