# Deploys worker/takeout to Cloudflare (takeout.cobander.com) on every push to main that touches it.
# Needs repo secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template). Optional repo secret AGENT_TOKEN is pushed to the
# Worker as its AGENT_TOKEN (support-drafting task's key for /inbox). Without CLOUDFLARE_API_TOKEN the job skips.
name: worker
on:
  push:
    branches: ['main']
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 75d9b64eb2b628f0c969a855c6673d58
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker/takeout
        run: npx -y wrangler@4 deploy
      - name: AGENT_TOKEN
        if: env.CLOUDFLARE_API_TOKEN != '' && env.AGENT_TOKEN != ''
        working-directory: worker/takeout
        run: printf '%s' "$AGENT_TOKEN" | npx -y wrangler@4 secret put AGENT_TOKEN
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set — skipped deploy"
