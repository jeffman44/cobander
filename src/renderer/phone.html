<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<title>Cobander — practice &amp; record</title>
<style>
  :root { --bg: #15171c; --bg2: #1d2027; --line: #30353f; --fg: #e6e8ee; --muted: #8b91a0; --xp: #e5b04b; --accent: #5b8def; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--bg2); border-bottom: 1px solid var(--line); }
  header b { font-size: 16px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #part { color: var(--xp); font-weight: 700; letter-spacing: .1em; font-size: 13px; }
  select, button { font: inherit; color: var(--fg); background: #262a33; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  #stage { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; padding: 16px; text-align: center; }
  .line { max-width: 100%; }
  .cur { font-size: calc(30px * var(--ks, 1)); font-weight: 700; min-height: 2.6em; display: flex; align-items: flex-end; justify-content: center; flex-wrap: wrap; }
  .next { font-size: calc(19px * var(--ks, 1)); color: var(--muted); }
  .prev { font-size: calc(15px * var(--ks, 1)); color: #5d6372; }
  .w { display: inline-flex; flex-direction: column; align-items: flex-start; margin: 0 .14em; }
  .c { font: 700 .55em ui-monospace, Menlo, monospace; color: var(--accent); min-height: 1.1em; }
  .cur .t { color: #8b91a0; } .cur .sung .t { color: var(--fg); } .cur .now .t { color: var(--xp); }
  #count { color: var(--muted); font-size: 18px; min-height: 1.3em; } #count.soon { color: var(--xp); font-size: 34px; font-weight: 700; }
  #bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
  #bars div { border: 1px solid var(--line); border-radius: 8px; padding: 14px 4px; font: 700 calc(26px * var(--ks, 1)) ui-monospace, Menlo, monospace; color: var(--muted); }
  #bars div.now { border-color: var(--xp); color: var(--fg); } #bars div.done { opacity: .45; }
  #bars .sec { grid-column: 1 / -1; border: 0; padding: 0; font-size: 13px; color: var(--xp); letter-spacing: .1em; text-align: left; }
  footer { display: flex; gap: 8px; padding: 10px 12px; background: var(--bg2); border-top: 1px solid var(--line); align-items: center; }
  footer button { flex: 1; font-size: 20px; padding: 12px 0; }
  footer #play { flex: 1.6; background: var(--accent); border-color: var(--accent); }
  #prog { height: 4px; background: #262a33; } #prog i { display: block; height: 100%; width: 0; background: var(--xp); }
  #msg { color: var(--muted); font-size: 14px; }
  .opts { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  /* ---- Record tab ---- */
  #tabs { display: flex; background: var(--bg2); border-bottom: 1px solid var(--line); }
  #tabs button { flex: 1; border: 0; border-radius: 0; background: none; color: var(--muted); padding: 10px; font-weight: 700; letter-spacing: .08em; font-size: 13px; }
  #tabs button.on { color: var(--fg); box-shadow: inset 0 -3px 0 var(--accent); }
  #rec { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  body.rec #rec { display: flex; } body.rec #stage, body.rec .opts, body.rec #prog, body.rec footer { display: none; }
  #rec .top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  #rec .bar { font: 700 30px ui-monospace, Menlo, monospace; min-width: 90px; }
  #rec .meter { flex: 1; height: 18px; background: #262a33; border-radius: 9px; overflow: hidden; position: relative; }
  #rec .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4caf7d 0 70%, #e5b04b 70% 88%, #e04b4b 88%); transition: width .08s linear; }
  #rec .meter b { position: absolute; right: 6px; top: 0; font-size: 11px; line-height: 18px; color: var(--fg); font-weight: 400; }
  #rec .meter.off i { background: #3a3f4a; } #rec .meter.off b { color: var(--muted); }
  #tracks { flex: 1; overflow: auto; padding: 6px 10px; }
  .trk { display: flex; align-items: center; gap: 8px; padding: 9px 6px; border-bottom: 1px solid var(--line); }
  .trk .nm { flex: 1; min-width: 0; } .trk .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .trk .nm small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trk button { padding: 10px 12px; font-weight: 700; min-width: 46px; }
  .trk .arm.on { background: #e04b4b; border-color: #e04b4b; color: #fff; animation: pulse 1.2s infinite; }
  .trk .ms.on { background: var(--xp); border-color: var(--xp); color: #000; } .trk .ms.solo.on { background: #4caf7d; border-color: #4caf7d; }
  .trk.theirs { opacity: .55; } .trk.theirs .arm { background: #3a3f4a; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(224,75,75,.7); } 50% { box-shadow: 0 0 0 8px rgba(224,75,75,0); } }
  #rec .ctl { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--bg2); align-items: center; flex-wrap: wrap; }
  #rec .ctl .t { flex: 1; display: flex; gap: 8px; } #rec .ctl .t button { flex: 1; font-size: 26px; padding: 14px 0; }
  #rec .ctl #r-rec { background: #e04b4b; border-color: #e04b4b; color: #fff; flex: 2; } #rec .ctl #r-rec.live { background: #7a1f1f; animation: pulse 1s infinite; }
  #rec .ctl #r-play.on { background: var(--accent); border-color: var(--accent); }
  #rec .opts2 { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; border-top: 1px solid var(--line); background: var(--bg2); }
  #rec .opts2 button, #rec .opts2 select { white-space: nowrap; } #rec .opts2 button.on { background: var(--accent); border-color: var(--accent); }
  #take { display: none; gap: 8px; align-items: center; padding: 10px 12px; background: #23281f; border-top: 1px solid #3a4a2f; }
  #take.show { display: flex; } #take span { flex: 1; } #take button { font-weight: 700; } #take #r-keep { background: #4caf7d; border-color: #4caf7d; color: #000; }
  #rmsg { color: var(--muted); font-size: 13px; padding: 4px 12px; min-height: 1.4em; }
  #parts { display: flex; gap: 6px; padding: 6px 12px; overflow-x: auto; } #parts button { white-space: nowrap; } #parts button.on { background: var(--xp); border-color: var(--xp); color: #000; }
</style>
</head>
<body>
<header><b id="song">Cobander</b><span id="part"></span></header>
<div id="tabs"><button id="tab-practice" class="on">PRACTICE</button><button id="tab-record">RECORD</button></div>
<div id="rec">
  <div class="top"><div class="bar" id="r-bar">1.1</div><div class="meter off" id="r-meter"><i></i><b>no input</b></div></div>
  <div id="rmsg"></div>
  <div id="parts"></div>
  <div id="tracks"></div>
  <div id="take"><span id="take-txt"></span><button id="r-retake">Retake</button><button id="r-keep">Keep</button></div>
  <div class="opts2"><button id="r-click">click</button><button id="r-countin">count-in</button><button id="r-punch">punch in/out</button><button id="r-add">+ track</button></div>
  <div class="ctl"><div class="t"><button id="r-start" aria-label="to start">⏮</button><button id="r-play" aria-label="play / pause">▶</button><button id="r-rec" aria-label="record">●</button></div></div>
</div>
<div class="opts">
  <select id="view"><option value="both">words + chords</option><option value="chords">chords only</option><option value="words">words only</option></select>
  <select id="tp"></select>
  <button id="size">A±</button>
</div>
<div id="prog"><i></i></div>
<div id="stage">
  <div id="prev" class="line prev"></div>
  <div id="count"></div>
  <div id="cur" class="line cur"></div>
  <div id="next" class="line next"></div>
  <div id="bars" hidden></div>
  <div id="msg"></div>
</div>
<footer>
  <button id="prevpart" aria-label="previous part">⏮</button>
  <button id="play" aria-label="play / pause">▶</button>
  <button id="nextpart" aria-label="next part">⏭</button>
</footer>
<script>
(() => {
  const K = new URLSearchParams(location.search).get('k') || '';
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const NOTES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B']; const PC = { C: 0, 'B#': 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, Fb: 4, F: 5, 'E#': 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11, Cb: 11 };
  const tpNote = (n, k) => (PC[n] == null ? n : NOTES[(((PC[n] + k) % 12) + 12) % 12]);
  const tpChord = (c, k) => (!k || !c ? c : String(c).replace(/^([A-G][#b]?)/, (m) => tpNote(m, k)).replace(/\/([A-G][#b]?)/, (m, n) => `/${tpNote(n, k)}`));
  for (let k = -6; k <= 6; k++) { const o = new Option(k ? `chords ${k > 0 ? '+' : ''}${k}${k < 0 ? ` (capo ${-k})` : ''}` : 'chords as written', String(k)); $('#tp').append(o); }
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} }; const load = (k, d) => { try { return localStorage.getItem(k) || d; } catch (_) { return d; } };
  $('#tp').value = load('bpp.tp', '0'); $('#view').value = load('bpp.view', 'both'); let ks = Number(load('bpp.ks', '1')) || 1; document.body.style.setProperty('--ks', ks);
  $('#tp').onchange = () => { save('bpp.tp', $('#tp').value); barsKey = ''; }; $('#view').onchange = () => { save('bpp.view', $('#view').value); barsKey = ''; };
  $('#size').onclick = () => { ks = ks >= 1.8 ? 0.8 : Math.round((ks + 0.2) * 10) / 10; document.body.style.setProperty('--ks', ks); save('bpp.ks', String(ks)); };
  let st = null, lines = [], v = 0, got = 0, barsKey = '', pollT = 0;
  async function poll() {
    try {
      const r = await fetch(`/state?k=${encodeURIComponent(K)}&v=${v}`, { cache: 'no-store' }); const s = await r.json();
      if (s.error) throw new Error(s.error);
      if (s.lines) { lines = s.lines; v = s.v; barsKey = ''; }
      st = s; got = performance.now(); $('#msg').textContent = s.song ? '' : 'No song open in Cobander.';
      if (recTab) renderRec();
    } catch (err) { $('#msg').textContent = `Can't reach Cobander (${err.message}) — same Wi-Fi as the computer?`; if (recTab) $('#rmsg').textContent = `Can't reach Cobander (${err.message}).`; }
    clearTimeout(pollT); pollT = setTimeout(poll, recTab ? 250 : st && st.playing ? 700 : 1500);
  }
  async function cmd(action, extra = {}) { try { await fetch(`/cmd?k=${encodeURIComponent(K)}`, { method: 'POST', body: JSON.stringify({ action, ...extra }) }); setTimeout(poll, 120); } catch (_) {} }
  $('#play').onclick = () => cmd('toggle'); $('#prevpart').onclick = () => cmd('prevpart'); $('#nextpart').onclick = () => cmd('nextpart');
  // ---- Record tab: drive a take from across the room ----
  let recTab = load('bpp.tab', 'practice') === 'record';
  const setTab = (rec) => { recTab = rec; document.body.classList.toggle('rec', rec); $('#tab-record').classList.toggle('on', rec); $('#tab-practice').classList.toggle('on', !rec); save('bpp.tab', rec ? 'record' : 'practice'); setTimeout(poll, 50); };
  $('#tab-practice').onclick = () => setTab(false); $('#tab-record').onclick = () => setTab(true); setTab(recTab);
  const rcmd = (action, extra) => cmd(action, extra);
  $('#r-rec').onclick = () => rcmd(st && st.rec && st.rec.recording ? 'stop' : 'record');
  $('#r-play').onclick = () => rcmd(st && st.rec && st.rec.recording ? 'stop' : 'play');
  $('#r-start').onclick = () => rcmd('tostart');
  $('#r-click').onclick = () => rcmd('click', { on: !(st && st.rec && st.rec.click) });
  $('#r-countin').onclick = () => rcmd('countin', { on: !(st && st.rec && st.rec.countIn) });
  $('#r-punch').onclick = () => rcmd('punch', { on: !(st && st.rec && st.rec.punch) });
  $('#r-add').onclick = () => { const n = prompt('New track name', 'Take'); if (n != null) rcmd('addtrack', { name: n }); };
  $('#r-retake').onclick = () => rcmd('retake'); $('#r-keep').onclick = () => rcmd('keep');
  let trkKey = '', partsKey = '';
  function renderRec() {
    const r = st && st.rec; if (!r) { $('#rmsg').textContent = st && st.song ? '' : 'No song open in Cobander.'; return; }
    $('#r-bar').textContent = r.bar;
    const m = $('#r-meter'); m.classList.toggle('off', !r.inputOpen || r.input == null); const db = r.input == null ? -90 : r.input; const pct = Math.max(0, Math.min(100, (db + 60) / 60 * 100)); m.querySelector('i').style.width = `${r.inputOpen ? pct : 0}%`; m.querySelector('b').textContent = r.inputOpen ? (db <= -90 ? '−∞' : `${db.toFixed(0)} dB`) : 'input opens when you arm / record';
    $('#r-rec').classList.toggle('live', r.recording); $('#r-rec').textContent = r.recording ? '■' : '●'; $('#r-play').classList.toggle('on', r.playing && !r.recording); $('#r-play').textContent = r.playing ? '❚❚' : '▶';
    $('#r-click').classList.toggle('on', r.click); $('#r-countin').classList.toggle('on', r.countIn); $('#r-punch').classList.toggle('on', r.punch);
    $('#r-countin').textContent = r.countIn ? `count-in ${r.countInBars}` : 'count-in';
    const armed = r.tracks.find((t) => t.armed);
    $('#rmsg').textContent = r.readOnly ? 'Read-only on the computer — take over there first.' : r.recording ? `Recording on ${armed ? armed.name : '…'} — ■ when you're done.` : r.finishing ? 'Saving the take…' : armed ? `Armed: ${armed.name}. ● records${r.countIn ? ' after the count-in' : ''}${r.loop ? ', looping the part' : ''}.` : 'Arm a track (●) to record onto it.';
    const tk = r.lastTake; $('#take').classList.toggle('show', !!tk && !r.recording); if (tk) $('#take-txt').textContent = `${tk.name} on ${tk.track} · ${tk.secs}s`;
    const pk = JSON.stringify([r.parts.map((p) => p.id + p.name), r.loop]); if (pk !== partsKey) { partsKey = pk; const box = $('#parts'); box.innerHTML = ''; if (r.parts.length) { const off = el('button', !r.loop ? 'on' : '', 'whole song'); off.onclick = () => rcmd('loop', {}); box.append(off); for (const p of r.parts) { const b = el('button', r.loop && Math.abs(r.loop.from - p.start) < 0.01 && Math.abs(r.loop.to - p.end) < 0.01 ? 'on' : '', `${p.name} ${p.bar}`); b.onclick = () => rcmd('loop', { part: p.id }); box.append(b); } } }
    const key = JSON.stringify(r.tracks); if (key === trkKey) return; trkKey = key;
    const box = $('#tracks'); box.innerHTML = '';
    for (const t of r.tracks) {
      const row = el('div', 'trk' + (t.heldBy ? ' theirs' : '')); const nm = el('div', 'nm'); nm.append(el('b', null, t.name), el('small', null, `${t.takes} take${t.takes === 1 ? '' : 's'}${t.last ? ` · ${t.last}` : ''}${t.heldBy ? ` · ${t.heldBy} has it` : ''}`));
      const arm = el('button', 'arm' + (t.armed ? ' on' : ''), '●'); arm.onclick = () => rcmd('arm', { trackId: t.id }); if (t.midi) arm.disabled = true;
      const mu = el('button', 'ms' + (t.mute ? ' on' : ''), 'M'); mu.onclick = () => rcmd('mute', { trackId: t.id });
      const so = el('button', 'ms solo' + (t.solo ? ' on' : ''), 'S'); so.onclick = () => rcmd('solo', { trackId: t.id });
      row.append(nm, mu, so, arm); box.append(row);
    }
    if (!r.tracks.length) box.append(el('div', null, 'No tracks yet — + track makes one and arms it.'));
  }
  const now = () => { if (!st) return 0; let t = st.pos + (st.playing ? (performance.now() - got) / 1000 * (st.rate || 1) : 0); if (st.loop && st.playing && t >= st.loop.to) t = st.loop.from + ((t - st.loop.from) % (st.loop.to - st.loop.from)); return t; };
  function lineAt(t) { let i = -1; for (let k = 0; k < lines.length; k++) { if (lines[k].time <= t + 1e-3) i = k; else break; } const cur = i >= 0 && t <= lines[i].end + 1.2 ? lines[i] : null; return { i, cur, next: lines[i + 1] || null }; }
  function render(node, l, t, big) {
    node.innerHTML = ''; if (!l) return; const k = Number($('#tp').value) || 0; const showC = $('#view').value !== 'words';
    l.words.forEach((w, i) => { const s = el('span', 'w'); const cs = showC ? l.chords.filter((c) => c.wi === i).map((c) => tpChord(c.chord, k)) : []; s.append(el('span', 'c', cs.join(' '))); s.append(el('span', 't', w.w)); if (big && t != null) { if (t >= w.e) s.classList.add('sung'); else if (t >= w.t) s.classList.add('now'); } node.append(s); });
  }
  function bars(t) {
    const box = $('#bars'); const sc = (st.sections || []).find((x) => t >= x.start && t < x.end) || null; const k = Number($('#tp').value) || 0;
    const key = JSON.stringify([sc && sc.start, k, v]);
    if (key !== barsKey) { barsKey = key; box.innerHTML = ''; box.append(el('div', 'sec', sc ? sc.name.toUpperCase() : '')); for (const b of (sc ? sc.bars : st.bars || []) || []) { const d = el('div', null, b.chords.map((c) => tpChord(c, k)).join(' ') || (b.held ? '–' : '')); d.dataset.s = b.s; d.dataset.e = b.e; box.append(d); } }
    for (const d of box.querySelectorAll('div[data-s]')) { const s = Number(d.dataset.s), e = Number(d.dataset.e); d.classList.toggle('now', t >= s && t < e); d.classList.toggle('done', t >= e); }
  }
  function frame() {
    requestAnimationFrame(frame); if (!st || !st.song) return;
    const t = now(); $('#song').textContent = st.song + (st.setlist ? ` · ${st.setlist}` : ''); $('#play').textContent = st.playing ? '❚❚' : '▶';
    const sc = (st.sections || []).find((x) => t >= x.start && t < x.end); $('#part').textContent = sc ? sc.name.toUpperCase() : '';
    $('#prog i').style.width = `${Math.min(100, 100 * t / Math.max(1, st.end || 1))}%`;
    const chordsOnly = $('#view').value === 'chords';
    for (const id of ['#prev', '#cur', '#next']) $(id).hidden = chordsOnly; $('#bars').hidden = !chordsOnly;
    if (chordsOnly) { bars(t); $('#count').textContent = ''; return; }
    const a = lineAt(t); render($('#cur'), a.cur, t, true); render($('#prev'), a.cur ? lines[a.i - 1] : lines[a.i] || null, null, false); render($('#next'), a.next, null, false);
    const c = $('#count'); if (!a.cur && a.next) { const s = a.next.time - t; c.textContent = s <= 3.2 ? String(Math.max(1, Math.ceil(s))) : `${a.next.section ? `${a.next.section} — ` : ''}♪ ${Math.round(s)} s`; c.className = s <= 3.2 ? 'soon' : ''; } else { c.textContent = ''; c.className = ''; }
    if (!lines.length) $('#cur').textContent = 'No timed lyrics in this song yet — chords only shows the bars.';
  }
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (_) {}
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (_) {} } });
  poll(); frame();
})();
</script>
</body>
</html>
